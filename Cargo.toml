[workspace]
members = [
    "aura-core",
    "aura-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jeff Kenniston"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
wasmtime = "22.0"
wasmtime-wasi = "22.0"
cranelift = "0.109"
tokio-quiche = "0.2"
spiffe = { version = "0.16", features = ["workload-api-x509"] }
tree-sitter = "0.25"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
zenoh = "0.11"
blake3 = "1.5"
ignore = "0.4"
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui-image = "0.7"
tokio-stream = "0.1"
zenoh-shm = "0.11"
spiffe-rustls-tokio = "*"
cedar-policy = "3.1"
cedarling = "*"
tower = "0.4"
hyper = "1.3"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
miette = { version = "7.2", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
flume = "0.11"
