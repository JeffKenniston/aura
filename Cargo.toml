[workspace]
members = [
    "aura-core",
    "aura-cli",
    "tools/filesystem",
    "tools/ast-blast-radius",
    "tools/ephemeral-tunnel",
    "deploy/images/vsock-screenshot-daemon",
    "deploy/images/vsock-shell-daemon"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jeff Kenniston"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
wasmtime = "=22.0.1"
wasmtime-wasi = "=22.0.1"
cranelift = "=0.109.1"
tokio-quiche = "=0.2.1"
spiffe = { version = "0.16", features = ["workload-api-x509"] }
tree-sitter = "0.25"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
zenoh = "0.11"
blake3 = "1.5"
ignore = "0.4"
toml = "0.8"
serde_yaml = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.40"
anyhow = "1.0.86"
thiserror = "1.0.63"
wit-bindgen = "0.36"
uuid = { version = "1.10", features = ["v4"] }

[profile.test]
debug = 0
opt-level = 0
lto = false
