[workspace]
members = [
    "aura-core",
    "aura-cli"
]
exclude = [
    "tools"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jeff Kenniston"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
wasmtime = "=24.0.7"
wasmtime-wasi = "=49.0.2"
cranelift = "=0.109.1"
tokio-quiche = "=0.2.1"
spiffe = { version = "0.16", features = ["workload-api-x509"] }
tree-sitter = "0.25"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
zenoh = "0.11"
blake3 = "1.5"
ignore = "0.4"
toml = "0.8"
serde_yaml = "0.9"

