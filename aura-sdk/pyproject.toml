[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-sdk"
version = "0.1.0"
description = "Aura Python Cognitive Scripting and Multi-Agent Orchestration SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "google-genai>=0.1.0",
    "zenoh>=0.11.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]
