[package]
name = "aura-bus"
version = "0.1.0"
edition = "2021"
authors = ["Jeff Kenniston"]
license = "Apache-2.0"
description = "Aura Data Bus and Eventing"

[dependencies]
aura-transport = { path = "../transport" }
aura-iam = { path = "../iam" }
aura-data = { path = "../data" }
aura-runtime-microvm = { path = "../runtimes/microvm" }
aura-runtime-wasm = { path = "../runtimes/wasm" }
zenoh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
flume = "0.11"
wat = "1.261"
wasmtime = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
aura-transport = { path = "../transport" }
