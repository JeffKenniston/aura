[package]
name = "vsock-screenshot-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Jeff Kenniston"]
license = "Apache-2.0"
description = "Lightweight X11 screenshot daemon piping PNG frames over AF_VSOCK to host"


[dependencies]
x11rb = { version = "0.14", features = ["xtest"] }
png = "0.18"
vsock = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
