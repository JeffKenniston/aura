[workspace]
members = [
    "filesystem",
    "ast-blast-radius",
    "ephemeral-tunnel",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jeff Kenniston"]
license = "Apache-2.0"

[workspace.dependencies]
wit-bindgen = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.10", features = ["v4"] }
